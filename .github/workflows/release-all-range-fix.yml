name: Release all-range loader race fix

on:
  push:
    branches:
      - "stability/release-all-range-fix"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-all-range-loader-race
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify, and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out verified main source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git release identity
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull --ff-only origin main
          if ((git rev-parse HEAD).Trim() -ne "9301a5003618e63250b7142ed748e82be61b178f") {
            throw "main moved after verification; release aborted to avoid publishing unverified source."
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build, verify, and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v2026.08.20-all-range-fix
          RELEASE_TITLE: MultiPingCheck v2026.08.20-all-range-fix
          RELEASE_NOTES: >-
            50개 대상을 약 30분 측정한 뒤 시간 범위를 반복 변경하고
            '측정 전체'를 선택할 때 발생할 수 있던 세션 로그 QThread
            종료 경합을 수정했습니다. 이전 로더의 GUI 정리가 끝나기 전에
            다음 로더가 교체 설치되지 않도록 수명 주기를 직렬화했습니다.
        run: |
          .\scripts\publish_release.ps1 `
            -Tag $env:RELEASE_TAG `
            -Title $env:RELEASE_TITLE `
            -Notes $env:RELEASE_NOTES

      - name: Report published release to pull request
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v2026.08.20-all-range-fix
          PR_NUMBER: "3"
        run: |
          $releaseUrl = (& gh release view $env:RELEASE_TAG --json url --jq '.url').Trim()
          $zip = Get-ChildItem -LiteralPath .\release -Filter "MultiPingCheck_$($env:RELEASE_TAG).zip" | Select-Object -First 1
          if (-not $zip) {
            throw "Published ZIP was not found in the release output directory."
          }
          $checksumPath = "$($zip.FullName).sha256"
          $checksum = (Get-Content -LiteralPath $checksumPath -Raw).Trim()
          $runUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $body = @"
          ✅ Windows Release 게시 완료

          - 태그: `$env:RELEASE_TAG`
          - 기준 커밋: `9301a5003618e63250b7142ed748e82be61b178f`
          - ZIP: `$($zip.Name)`
          - SHA256: `$checksum`
          - Release: $releaseUrl
          - 빌드 및 EXE 검증 로그: $runUrl
          "@
          & gh pr comment $env:PR_NUMBER --body $body

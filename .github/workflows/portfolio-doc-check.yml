name: Portfolio documentation check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  render-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out portfolio branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/portfolio-polish
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip bootstrap failed." }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "dependency installation failed." }

      - name: Render verified PySide6 documentation screen
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m scripts.render_docs_screenshots

      - name: Commit rendered screen to portfolio branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/images/multiping-main.png
          if (git diff --cached --quiet) {
            Write-Host "Documentation screen is unchanged."
            exit 0
          }
          git commit -m "docs: 실제 MultiPingCheck 측정 화면 추가"
          git push origin HEAD:agent/portfolio-polish

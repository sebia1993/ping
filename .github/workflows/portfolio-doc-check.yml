name: Portfolio documentation check

on:
  push:
    branches:
      - agent/portfolio-polish
    paths:
      - .github/workflows/portfolio-doc-check.yml

permissions:
  contents: write

jobs:
  render-doc-screenshots:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out portfolio branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/portfolio-polish
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Render actual PySide6 documentation screens
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts\render_docs_screenshots.py

      - name: Commit generated documentation screens
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/images/multiping-main.png docs/images/multiping-sessions.png
          if (git diff --cached --quiet) {
            Write-Host "Documentation screenshots are unchanged."
            exit 0
          }
          git commit -m "docs: 실제 MultiPingCheck 화면 추가"
          git push origin HEAD:agent/portfolio-polish

  verify-windows-package:
    needs: render-doc-screenshots
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Check out latest portfolio branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/portfolio-polish
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run source release verifier
        shell: pwsh
        run: python scripts\verify_release.py

      - name: Build Windows EXE
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build_windows_exe.ps1

      - name: Verify packaged EXE
        shell: pwsh
        run: python scripts\verify_release.py --exe

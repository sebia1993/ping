name: Portfolio documentation check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: portfolio-doc-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-and-verify:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip bootstrap failed." }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "dependency installation failed." }

      - name: Render actual PySide6 documentation screens
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python scripts\render_docs_screenshots.py

      - name: Upload rendered documentation screens
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
        with:
          name: multiping-doc-screens-${{ github.run_id }}
          path: docs/images
          if-no-files-found: error

      - name: Run source release verifier
        shell: pwsh
        run: python scripts\verify_release.py

      - name: Build Windows EXE
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\build_windows_exe.ps1

      - name: Verify packaged EXE
        shell: pwsh
        run: python scripts\verify_release.py --exe
